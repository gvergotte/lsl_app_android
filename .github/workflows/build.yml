name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev
          pip install --break-system-packages buildozer "Cython<3.1"

      - name: Configure and Build APK
        run: |
          buildozer init
          
          # Fix 1: Standard python3 requirement (matches host automatically)
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pylsl/g' buildozer.spec
          
          # Fix 2: Limit architecture to 64-bit ARM only (arm64-v8a)
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/g' buildozer.spec
          
          # Fix 3: Enable p4a master branch for modern C-extension support
          sed -i 's/#p4a.branch = master/p4a.branch = master/g' buildozer.spec
          
          # Fix 4: Add INTERNET and multicast Wi-Fi permissions for LSL
          sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET, ACCESS_NETWORK_STATE, CHANGE_WIFI_MULTICAST_STATE/g' buildozer.spec
          
          # Run build with auto-accept
          yes | buildozer -v android debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: LSL-Android-App
          path: bin/*.apk
