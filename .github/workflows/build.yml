name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev
          pip install buildozer Cython==3.0.11

      - name: Configure and Build APK
        run: |
          buildozer init
          sed -i 's/requirements = python3,kivy/requirements = python3==3.11.0,kivy,pylsl/g' buildozer.spec
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/g' buildozer.spec
          sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET, ACCESS_NETWORK_STATE, CHANGE_WIFI_MULTICAST_STATE/g' buildozer.spec
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LSL-Android-App
          path: bin/*.apk
